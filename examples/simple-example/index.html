<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <title>GeoSearch</title>

    <meta name="description" content="GeoSearch from OpenCageData" />
    <link rel="stylesheet" href="./dist/css/autocomplete-theme-classic.min.css" />
    <!-- <link rel="stylesheet" href="./leaflet-opencage-geosearch.css" /> -->
    <link rel="stylesheet" href="styles.css" />

</head>

<body>
    <div id="api-error" class="error-banner hidden" role="alert"></div>
    <div id="autocomplete"></div>
    <script src="./dist/js/opencage-geosearch-bundle.js"></script>
    <script src="config.js"></script>
    <script>
        const options = {
            key: window.OPENCAGE_GEOSEARCH_KEY,
        };

        const errorBanner = document.getElementById('api-error');

        const events = {
            onError: function handleError(err) {
                console.error('GeoSearch error', err);
                if (err.status === 401 || err.status === 403) {
                    errorBanner.textContent = 'Invalid API key. Please check the key you entered.';
                } else {
                    errorBanner.textContent = 'GeoSearch request failed. Please try again.';
                }
                errorBanner.classList.remove('hidden');
            },
        };

        opencage.algoliaAutocomplete({
            container: '#autocomplete',
            placeholder: 'Search for places',
            plugins: [opencage.OpenCageGeoSearchPlugin(options, events)],
        });

    </script>
</body>

</html>
